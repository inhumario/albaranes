<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Albaranes{% endblock %}</title>
<style>
:root{
  --titulo:#0E4A31; --sub:#1F7A50; --filete:#35996A; --cab:#EAF4EE;
  --zebra:#F5FAF7; --borde:#C9DED3; --texto:#1F2D26; --fondo:#FBFDFC;
  --aviso:#8a5a00; --aviso-f:#fdf4e3; --rojo:#8a2020; --rojo-f:#fbecec;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
     color:var(--texto);background:var(--fondo);line-height:1.55}
header{background:var(--titulo);color:#fff;padding:.7rem 1rem;display:flex;
       align-items:center;gap:1.2rem;flex-wrap:wrap}
header .marca{font-weight:700;font-size:1.05rem}
nav{display:flex;gap:.9rem;flex-wrap:wrap}
nav a{color:#dcefe4;text-decoration:none;padding:.15rem 0;border-bottom:2px solid transparent}
nav a.activo,nav a:hover{color:#fff;border-color:var(--filete)}
main{max-width:1000px;margin:0 auto;padding:1.2rem 16px 3rem}
h1{color:var(--titulo);font-size:1.45rem;margin:.4rem 0 1rem}
h2{color:var(--sub);font-size:1.1rem;margin:1.6rem 0 .6rem}
.aviso{background:var(--cab);border:1px solid var(--borde);border-left:4px solid var(--filete);
       padding:.55rem .8rem;border-radius:6px;margin-bottom:1rem}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:1rem 0}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:.7rem .9rem}
.tarjeta .n{font-size:1.6rem;font-weight:700;color:var(--titulo)}
.tarjeta .t{font-size:.85rem;color:var(--sub)}
.tabla-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem}
th{background:var(--cab);color:var(--titulo);text-align:left;padding:.5rem .6rem;
   border-bottom:2px solid var(--filete);white-space:nowrap}
td{padding:.45rem .6rem;border-bottom:1px solid var(--borde)}
tr:nth-child(even) td{background:var(--zebra)}
.pill{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.8rem;white-space:nowrap}
.pill.archivado{background:var(--cab);color:var(--titulo)}
.pill.entregado{background:var(--filete);color:#fff}
.pill.pendiente_entrega{background:var(--aviso-f);color:var(--aviso)}
.pill.revisar,.pill.error{background:var(--rojo-f);color:var(--rojo)}
.pill.procesando{background:var(--zebra);color:var(--sub)}
.pill.colocado{background:#e6f0fb;color:#1d4f86}
.boton{background:var(--sub);color:#fff;border:0;border-radius:6px;padding:.45rem .9rem;
       font-size:.92rem;cursor:pointer;text-decoration:none;display:inline-block}
.boton:hover{background:var(--titulo)}
.boton.suave{background:var(--cab);color:var(--titulo);border:1px solid var(--borde)}
form.linea{display:inline}
input[type=text],input[type=search],select,textarea{
  width:100%;padding:.45rem .6rem;border:1px solid var(--borde);border-radius:6px;
  font-size:.95rem;background:#fff;color:var(--texto)}
label{display:block;margin:.8rem 0 .25rem;color:var(--sub);font-weight:600;font-size:.9rem}
.subida{border:1px solid var(--borde);border-radius:10px;background:#fff;padding:1.1rem}
.subida-cab{display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.7rem}
.zona{display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center;margin:0;
      border:2px dashed var(--borde);border-radius:10px;padding:1.4rem 1rem;cursor:pointer;
      color:var(--texto);font-weight:400;font-size:.95rem;background:var(--fondo);transition:all .15s}
.zona:hover,.zona.encima{border-color:var(--filete);background:var(--cab)}
.zona-icono{font-size:1.7rem}
.lista-ficheros{list-style:none;margin:.7rem 0 0;padding:0}
.lista-ficheros li{display:flex;align-items:center;gap:.7rem;padding:.45rem .6rem;border:1px solid var(--borde);
      border-radius:6px;margin-bottom:.35rem;background:var(--zebra)}
.lista-ficheros .nombre-fichero{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.quitar{border:0;background:none;color:var(--rojo);font-size:1.35rem;line-height:1;cursor:pointer;padding:0 .3rem}
.quitar:hover{background:var(--rojo-f);border-radius:4px}
.subida-pie{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.boton:disabled{opacity:.45;cursor:default}
a{color:var(--sub)}
.mini{font-size:.82rem;color:#5a6d63}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;padding:.9rem}
.doc{border:1px solid var(--borde);border-radius:8px;background:var(--fondo);overflow:hidden;display:flex;flex-direction:column}
.doc img{width:100%;aspect-ratio:210/297;object-fit:cover;object-position:top;border-bottom:1px solid var(--borde);background:#fff}
.doc .pie{padding:.45rem .55rem;font-size:.85rem}
.doc .nombre{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--titulo);word-break:break-all}
.doc details summary{cursor:pointer;color:var(--sub);font-size:.8rem;margin-top:.2rem}
.doc details input,.doc details select{font-size:.85rem;padding:.3rem .4rem;margin-top:.3rem}
.doc details .boton{margin-top:.4rem;padding:.3rem .6rem;font-size:.82rem}
.migas{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.95rem;margin:-.4rem 0 1rem}
.migas a{text-decoration:none}.migas .sep{color:#9bb3a6}
.carpetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem;margin-bottom:1.2rem}
.carpeta-t{display:flex;gap:.7rem;align-items:center;background:#fff;border:1px solid var(--borde);border-radius:8px;
           padding:.75rem .9rem;text-decoration:none;color:var(--texto);transition:all .15s}
.carpeta-t:hover{border-color:var(--filete);background:var(--cab)}
.carpeta-t .icono{font-size:1.8rem;line-height:1}
.carpeta-t .titulo{font-weight:700;color:var(--titulo)}
.carpeta-t.roja .titulo{color:var(--rojo)}
.cab-archivo{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.4rem}
.cab-archivo h1{margin:.4rem 0}
.cab-archivo .boton{margin-left:auto}
@media (max-width:640px){
  main{padding:0.8rem 16px 2rem}
  .rejilla{grid-template-columns:repeat(2,1fr);gap:.6rem;padding:.6rem}
  .carpetas{grid-template-columns:1fr 1fr}
  h1{font-size:1.25rem}
  th,td{padding:.4rem .45rem;font-size:.85rem}
}
</style>
</head>
<body>
<header>
  <span class="marca">📦 Albaranes</span>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'activo' if request.endpoint=='index' }}">Panel</a>
    <a href="{{ url_for('revision') }}" class="{{ 'activo' if request.endpoint=='revision' }}">Revisión</a>
    <a href="{{ url_for('albaranes') }}" class="{{ 'activo' if request.endpoint in ('albaranes','carpeta_zip') }}">Archivo</a>
    <a href="{{ url_for('clientes') }}" class="{{ 'activo' if request.endpoint and request.endpoint.startswith('cliente') }}">Clientes</a>
    <a href="{{ url_for('ajustes') }}" class="{{ 'activo' if request.endpoint=='ajustes' }}">Ajustes</a>
  </nav>
  {% if session.get('acceso') %}<a href="{{ url_for('salir') }}" style="margin-left:auto;color:#dcefe4;text-decoration:none;font-size:.85rem">Salir</a>{% endif %}
</header>
<main>
{% with mensajes = get_flashed_messages() %}
  {% for m in mensajes %}<div class="aviso">{{ m }}</div>{% endfor %}
{% endwith %}
{% block cuerpo %}{% endblock %}
</main>
</body>
</html>
